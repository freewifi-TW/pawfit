apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 2000
      derivedFields:
        # 點 request_id 直接跳到「同一個請求在所有服務的紀錄」
        - name: request_id
          matcherType: label
          matcherRegex: request_id
          url: '{request_id="${__value.raw}"}'
          datasourceUid: loki
